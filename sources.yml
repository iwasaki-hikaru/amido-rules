# 上流のリストと自作ルール。書式は docs/format.md の「sources.yml」を参照（YAML の一部だけを使う）。
# ライセンスが不明なリストや、280blocker のフィルタは入れない（要件 §0.7）。
sources:
  - name: EasyList
    url: https://easylist.to/easylist/easylist.txt
    license: CC-BY-SA-3.0
    attribution: The EasyList authors (https://easylist.to/)
    category: basic
    enabled: true

  - name: 自作ルール（basic）
    path: custom/basic.txt
    license: CC-BY-SA-3.0
    attribution: safari-blocker rules contributors
    category: basic
    enabled: true

  # 配布物の先頭は CC BY 3.0。元のファイル（github.com/easylist/easylist の fanboy-addon/）は
  # GPLv3 以降と CC BY-SA 3.0 以降のデュアルライセンス（https://easylist.to/pages/licence.html）。
  # どちらも満たすように、annoyance として CC BY-SA 3.0 で配る（docs/licensing.md）
  - name: Fanboy's Social Blocking List
    url: https://secure.fanboy.co.nz/fanboy-social.txt
    license: CC-BY-SA-3.0
    attribution: The EasyList authors (https://easylist.to/)
    category: annoyance
    enabled: true

  - name: Fanboy's Notifications List
    url: https://secure.fanboy.co.nz/fanboy-notifications.txt
    license: CC-BY-SA-3.0
    attribution: The EasyList authors (https://easylist.to/)
    category: annoyance
    enabled: true

  - name: 自作ルール（annoyance）
    path: custom/annoyance.txt
    license: CC-BY-SA-3.0
    attribution: safari-blocker rules contributors
    category: annoyance
    enabled: true

  - name: 自作ルール（scam）
    path: custom/scam.txt
    license: CC-BY-SA-3.0
    attribution: safari-blocker rules contributors
    category: scam
    enabled: true

  # GPLv3。ライセンスを確認するまで使わない（要件 §5.1）
  - name: AdGuard Japanese filter
    url: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_7_Japanese/filter.txt
    license: GPL-3.0
    attribution: AdGuard (https://github.com/AdguardTeam/AdguardFilters)
    category: basic
    enabled: false
