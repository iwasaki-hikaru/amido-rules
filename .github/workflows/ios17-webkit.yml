# iOS 17 のシミュレーターの WebKit で、公開のワークフローで作ったルール（アプリが Safari に渡す形）をコンパイルする（手動で実行する）。
#
# - iOS 17 のシミュレーターがあるのは macos-14 のイメージだけ。GitHub は、このイメージを 2026-11-02 に
#   使えなくする（https://github.com/actions/runner-images/issues/13518 ）。それ以降は、このワークフローを消し、
#   iOS 17 の実機か、手元に iOS 17 のランタイムを入れたシミュレーターで確かめる（docs/runbook.md）
# - 公開のワークフロー（publish.yml）が保存した合成した JSON（rules-compose）を使う。run_id を空にすると、
#   main で build と ios-webkit のジョブが成功した、最後の実行のものを使う
# - 実行全体の結果（deploy ジョブを含む）では判定しない（成功していなければ notice を出すだけ）。deploy は
#   production の承認・秘密情報・Cloudflare で失敗しうるが、合成した JSON はそれで変わらないため
# - 行列の 2 つ（17.0・17.5）は、それぞれ実行を選ぶ。選んだ run_id はログに出る（2 つが違う実行を使っていないか確かめる）
# - アクションは GitHub 公式のものだけを、コミットの SHA で固定する（コメントはその SHA のタグ）
name: iOS 17 の WebKit でコンパイル（手動）

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 合成した JSON を取り出す publish.yml の実行の ID（空なら、main で build と ios-webkit が成功した最後の実行）
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read # ほかの実行の成果物（rules-compose）を取り出すため

defaults:
  run:
    shell: bash

jobs:
  ios17:
    name: iOS ${{ matrix.version }} の WebKit でコンパイル
    runs-on: macos-14
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 対応する最も古い版（17.0）と、17 の最後にランナーにある版（17.5）
        version: ["17.0", "17.5"]
    env:
      # iOS 17 のシミュレーターの SDK を含み、Swift 6 系でビルドできる版
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 公開の実行を選ぶ
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          # 実行の build ジョブ（変換と検査。rules-compose を保存する）と ios-webkit ジョブ（iOS 18.6 の WebKit で
          # コンパイル）の結果を「build<TAB>ios-webkit」で出す。ジョブは publish.yml の name で探す（ios-webkit は
          # 「iOS <版> の WebKit でコンパイル」の形で、版の数字が変わっても見つかる。それ以外の形に変えたら、ここも直す）。
          # やり直した実行では、ジョブごとに最後の試行の結果を使う。ジョブが見つからなければ none
          job_results() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/jobs?filter=all&per_page=100" --jq '
              def result($re): [.jobs[] | select(.name | test($re))] | max_by(.run_attempt)
                | if . == null then "none" else (.conclusion // .status) end;
              [result("^変換と検査$"), result("^iOS [0-9.]+ の WebKit でコンパイル$")] | @tsv'
          }

          # フォークからの PR の実行（head_branch がフォーク側の main のもの）を選ばないように、
          # このリポジトリ自身の、main での push・定期実行・手動実行だけを使う
          run_id="$INPUT_RUN_ID"
          if [ -z "$run_id" ]; then
            candidates=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs?branch=main&per_page=50" \
              --jq ".workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and (.event == \"push\" or .event == \"schedule\" or .event == \"workflow_dispatch\")) | .id")
            for id in $candidates; do
              results=$(job_results "$id")
              IFS=$'\t' read -r build_result webkit_result <<< "$results"
              if [ "$build_result" = success ] && [ "$webkit_result" = success ]; then
                run_id="$id"
                break
              fi
            done
          fi
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::合成した JSON を取り出す publish.yml の実行が見つかりません（run_id を指定してください）"
            exit 1
          fi
          meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            --jq '[.path, .event, .head_branch, .head_repository.full_name, .status, .conclusion] | @tsv')
          IFS=$'\t' read -r run_path run_event run_branch run_repo run_status run_conclusion <<< "$meta"
          case "$run_event" in push | schedule | workflow_dispatch) event_ok=true ;; *) event_ok=false ;; esac
          if [ "$run_path" != ".github/workflows/publish.yml" ] || [ "$event_ok" != true ] || [ "$run_branch" != main ] \
            || [ "$run_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::実行 $run_id は、このリポジトリの main での publish.yml の実行ではありません（${meta}）"
            exit 1
          fi
          results=$(job_results "$run_id")
          IFS=$'\t' read -r build_result webkit_result <<< "$results"
          if [ "$build_result" != success ] || [ "$webkit_result" != success ]; then
            echo "::error::実行 $run_id では、build（変換と検査）と ios-webkit（iOS の WebKit でコンパイル）が成功していません（build：${build_result}、ios-webkit：${webkit_result}。none は、publish.yml にその名前のジョブが見つからないこと）"
            exit 1
          fi
          if [ "$run_conclusion" != success ]; then
            echo "::notice::実行 $run_id は、全体では成功していません（${run_status}・${run_conclusion:-なし}）。build と ios-webkit は成功しているので、その成果物を使います"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "publish.yml の実行 $run_id の成果物を使います"

      - name: 合成した JSON を受け取る
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rules-compose
          path: build/compose
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: iOS ${{ matrix.version }} のシミュレーターでコンパイルする
        run: .github/scripts/ios-webkit-check.sh "${{ matrix.version }}" build/compose/*.json
